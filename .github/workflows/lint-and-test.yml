name: Lint & Integration Test

on:
  pull_request:
    branches: [main, "release/*"]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-lint:
    name: Python Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install linters
        run: pip install ruff

      - name: Syntax check
        run: python -m py_compile Server/ghostwriter_server.py && python -m py_compile Server/prompts.py

      - name: Ruff lint
        run: ruff check Server/

      - name: Ruff format check
        run: ruff format --check Server/

  shellcheck:
    name: Shell Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Lint scripts
        run: shellcheck Scripts/*.sh

  languagetool-integration:
    name: LanguageTool Integration Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install Python dependencies
        run: pip install fastapi uvicorn language_tool_python

      - name: Run LanguageTool unit tests
        run: python Server/tests/test_languagetool.py
