name: PR Labeler

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  pull-requests: write

jobs:
  label:
    name: Auto-label PR
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Label by files changed
        uses: actions/github-script@v7
        with:
          script: |
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            });

            const labels = new Set();
            for (const file of files) {
              if (file.filename.startsWith('Sources/')) labels.add('swift');
              if (file.filename.startsWith('Server/')) labels.add('python');
              if (file.filename.startsWith('Scripts/')) labels.add('scripts');
              if (file.filename.startsWith('.github/')) labels.add('ci');
              if (file.filename.endsWith('.md')) labels.add('documentation');
            }

            if (labels.size > 0) {
              for (const label of labels) {
                try {
                  await github.rest.issues.getLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    name: label,
                  });
                } catch {
                  const colors = {
                    swift: 'f05138',
                    python: '3776ab',
                    scripts: '89e051',
                    ci: 'e3b341',
                    documentation: '0075ca',
                  };
                  await github.rest.issues.createLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    name: label,
                    color: colors[label] || 'ededed',
                  });
                }
              }

              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                labels: [...labels],
              });

              console.log('Added labels: ' + [...labels].join(', '));
            }
